plugins {
	id 'fabric-loom' version '1.18-SNAPSHOT' apply false
	id 'ploceus' version '1.18-SNAPSHOT' apply false
}

// Every Minecraft version is a subproject (versions/<mc>, see settings.gradle). Code and
// resources shared by all versions live in the root src/; a version adds only the files
// that differ in versions/<mc>/src/ (the same class must never exist in both places).
subprojects {
	apply plugin: 'fabric-loom'
	apply plugin: 'ploceus'

	base {
		archivesName = rootProject.archives_base_name
	}
	version = "${rootProject.version}+mc${project.minecraft_version}"
	group = rootProject.maven_group

	sourceSets {
		main {
			java.srcDirs = [rootProject.file('src/main/java'), 'src/main/java']
			resources.srcDirs = [rootProject.file('src/main/resources'), 'src/main/resources']
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

		if (project.raven_build != "0") {
			exceptions ploceus.raven(project.raven_build)
		}
		if (project.sparrow_build != "0") {
			signatures ploceus.sparrow(project.sparrow_build)
		}
		nests ploceus.nests(project.nests_build)
		mappings ploceus.featherMappings(project.feather_build)

		ploceus.dependOsl(rootProject.osl_version)
	}

	processResources {
		inputs.property 'version', project.version
		inputs.property 'minecraft_version', project.minecraft_version

		filesMatching('fabric.mod.json') {
			expand 'version': project.version, 'minecraft_version': project.minecraft_version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 8
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8
		withSourcesJar()
	}

	jar {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${base.archivesName.get()}" }
		}
	}

	// Old versions bundle libraries that modern JVMs reject (1.5.2's BouncyCastle fails class
	// verification on Java 25, breaking multiplayer login): run them on the Java players use.
	if (project.hasProperty('run_java')) {
		tasks.withType(JavaExec).configureEach {
			javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(project.run_java as int)
			}
			// the BouncyCastle classes bundled in old game jars come out of remapping with a
			// LocalVariableTable the verifier rejects (dev only; check real installs separately)
			jvmArgs '-noverify'
		}
	}

	loom {
		runs {
			server {
				// separate folder so the dev server never touches the client's run/
				runDir 'run-server'
			}
		}
	}
}
